# Bouwt Sfeerpakket + de demo-mods (Ambient Occlusion, Dynamic Shadows) voor Dusklight op macOS.
# Resultaat: artifact "dusklight-mods-macos-arm64" met drie .dusk-bestanden.
name: Mods bouwen

on:
  push:
  workflow_dispatch:
    inputs:
      dusklight_ref:
        description: "Dusklight-versie (git-tag)"
        default: "v2.0.3"

env:
  DUSKLIGHT_REF: ${{ github.event.inputs.dusklight_ref || 'v2.0.3' }}

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dusklight-broncode ophalen
        run: |
          git clone --depth 1 --branch "$DUSKLIGHT_REF" https://github.com/TwilitRealm/dusklight.git "$RUNNER_TEMP/dusklight"
          git -C "$RUNNER_TEMP/dusklight" submodule update --init --depth 1 extern/aurora

      - name: Gereedschap
        run: brew install ninja || true

      - name: Bouwen
        run: |
          set -e
          DUSK="$RUNNER_TEMP/dusklight"
          mkdir -p out
          bouw() {
            cmake -S "$2" -B "build-$1" -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_OSX_ARCHITECTURES=arm64 -DDUSK_DIR="$DUSK"
            cmake --build "build-$1"
            cp build-$1/mods/*.dusk out/
          }
          bouw sfeerpakket "$GITHUB_WORKSPACE"
          bouw ao_mod "$DUSK/mods/ao_mod"
          bouw shadow_mod "$DUSK/mods/shadow_mod"
          ls -la out
          for f in out/*.dusk; do unzip -l "$f" | grep -E "lib/|mod.json"; done

      - uses: actions/upload-artifact@v4
        with:
          name: dusklight-mods-macos-arm64
          path: out/*.dusk
          if-no-files-found: error

      - name: Mods in de branch "builds" zetten
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/builds" && cp out/*.dusk "$RUNNER_TEMP/builds/"
          cd "$RUNNER_TEMP/builds"
          printf 'Gebouwd door %s voor Dusklight %s (macOS arm64)\n' "$GITHUB_SHA" "$DUSKLIGHT_REF" > BUILD.txt
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Mods voor $DUSKLIGHT_REF ($GITHUB_SHA)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
